set -s escape-time 0
# Match Omarchy's terminal setup so themed colors arrive intact. Status colors
# below use ANSI names on purpose: palette entries 0-15 are what the active
# Omarchy theme rewrites, so the bar follows the theme for free.
# Fall back to screen-256color where tmux-256color terminfo is absent (older
# WSL images), since an unknown default-terminal stops tmux from starting.
if-shell 'infocmp tmux-256color > /dev/null 2>&1' \
    'set-option -g default-terminal "tmux-256color"' \
    'set-option -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*:RGB"
set -g history-limit 300000

# Extended key reporting for modified keys (e.g., Shift+Enter in Pi)
set -g extended-keys on
set -g extended-keys-format csi-u

# Previously inherited from Omarchy's ~/.config/tmux/tmux.conf, which tmux loads
# *after* ~/.tmux.conf and so won (it set `prefix2 C-b`, stealing Ctrl-b from
# nvim harpoon, and overrode the M-arrow bindings below). dev-env-omarchy now
# installs this file at that path instead. Omarchy's tmux.conf is not sourced:
# it is mostly keybindings, and the theming it does carry is runtime-only
# (omarchy-theme-set-tmux) plus the ANSI palette. See docs/MIGRATION.md.
set -g mouse on
set -g allow-passthrough on
set -g detach-on-destroy off

# bind-key -r f run-shell "tmux neww $HOME/.local/scripts/tmux-sessionizer"
bind-key f display-popup -E "$HOME/.local/scripts/tmux-sessionizer"
# Set prefix to Ctrl+a (similar to screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using | and -
bind | split-window -h
bind - split-window -v

# Zoom pane with Ctrl+q (no prefix needed)
bind -n C-q resize-pane -Z

# Vim-style pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload the config file with Prefix + R. dev-env-omarchy installs this file at
# the XDG path and deletes ~/.tmux.conf; plain dev-env still uses ~/.tmux.conf.
bind r run-shell 'f="$HOME/.config/tmux/tmux.conf"; [ -f "$f" ] || f="$HOME/.tmux.conf"; tmux source-file "$f"'

# Quick pane cycling
bind-key C-a last-pane

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1
#set-window-option -g automatic-rename on

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

bind -n M-j run 'zsh $HOME/.local/scripts/vim-tmux-move j'
bind -n M-k run 'zsh $HOME/.local/scripts/vim-tmux-move k'
bind -n M-h run 'zsh $HOME/.local/scripts/vim-tmux-move h'
bind -n M-l run 'zsh $HOME/.local/scripts/vim-tmux-move l'
bind -n M-Down run 'zsh $HOME/.local/scripts/vim-tmux-move j'
bind -n M-Up run 'zsh $HOME/.local/scripts/vim-tmux-move k'
bind -n M-Left run 'zsh $HOME/.local/scripts/vim-tmux-move h'
bind -n M-Right run 'zsh $HOME/.local/scripts/vim-tmux-move l'

# status-style is the option tmux actually renders from; status-fg/status-bg are
# a separate legacy pair. Was hardcoded to bg=#333333 fg=#5eacd3, which no theme
# could touch. ANSI names land in palette slots 0-15, which Omarchy rewrites.
# Omarchy's own bar uses bg=default, which shows terminal transparency through.
set -g status-style 'bg=black,fg=blue'
set -g pane-border-style fg=brightgreen
set -g pane-active-border fg=brightgreen
set -g message-style fg=yellow
set -g message-style bg=black
set -g status-left '#S ⮀'
# Worktree windows carry a per-window @wt_color user option (set by
# tmux-worktree); everything else falls back to yellow.
set -g window-status-format "#[fg=#{?@wt_color,#{@wt_color},yellow},bg=black] #I #W#($HOME/.local/scripts/tmux-cc-indicator #{session_name}:#{window_index}) #($HOME/.local/scripts/tmux-pi-indicator #{session_name}:#{window_index}) "
set -g window-status-current-format "#[fg=black,bg=#{?@wt_color,#{@wt_color},yellow}]⮀#[fg=black,bg=#{?@wt_color,#{@wt_color},yellow},noreverse,bold] #I ⮁ #W#($HOME/.local/scripts/tmux-cc-indicator #{session_name}:#{window_index}) #($HOME/.local/scripts/tmux-pi-indicator #{session_name}:#{window_index}) #[fg=#{?@wt_color,#{@wt_color},yellow},bg=black,nobold]⮀"
set -g status-right '#[fg=green]#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null) #[fg=white]| #[fg=yellow]%Y-%m-%d %H:%M'


set -g set-titles on
set -g set-titles-string "#T"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Move window left/right (no prefix needed)
bind -n M-, swap-window -t -1\; select-window -t -1
bind -n M-. swap-window -t +1\; select-window -t +1

#set -g status-utf8 on                  # set utf-8 for the status bar
set -g status-interval 5               # set update frequency (default 15 seconds)

# Vi keys
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle




# Center the window list
set -g status-justify centre

set -g pane-border-status top

# tig in a dedicated window (one per repo root, reused; press again inside it to
# jump back). A popup would be modal — M-<n> stays dead until tig quits.
# prefix + g    -> full tig (commit log)
# prefix + G    -> tig status
# prefix + C-g  -> throwaway tig popup, for a quick peek
# -d / the path argument are required: without them tmux uses the *session's*
# cwd (fixed at session creation = main repo), not the worktree you're in.
bind g run-shell "$HOME/.local/scripts/tmux-tig log '#{pane_current_path}'"
bind G run-shell "$HOME/.local/scripts/tmux-tig status '#{pane_current_path}'"
bind C-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "tig"

# Claude Code scratchpads: fzf-pick one of the throwaway scripts Claude wrote
# for this project and open it. Dedicated window, not a popup, for the same
# reason as tig above. -C passes the pane's worktree; without it the script
# would resolve against the session's cwd (fixed at creation = main repo).
# tmux-resurrect claims C-s too -- see @resurrect-save below.
bind C-s run-shell "$HOME/.local/scripts/claude-scratch -C '#{pane_current_path}' window"

# Worktree management
bind T display-popup -E "$HOME/.local/scripts/tmux-worktree create"
bind t display-popup -E "$HOME/.local/scripts/tmux-worktree overview"
bind C-t display-popup -E "$HOME/.local/scripts/tmux-worktree restore"
bind X display-popup -E "$HOME/.local/scripts/tmux-worktree remove"
bind C-x display-popup -E "$HOME/.local/scripts/tmux-worktree recycle"
# Repair a window whose panes have drifted out of the dev layout. Geometry
# only: no pane is respawned, so nvim/claude/dev servers keep running.
# C-l for "layout" — R is already rename-session (and tmux-sensible wants it
# for reloading this file), r is source-file above.
bind C-l display-popup -E "$HOME/.local/scripts/tmux-worktree relayout"

# tpm runs at the bottom of this file, so tmux-resurrect's own bind-key calls
# land *after* every binding above and silently win. Its default save key is
# C-s, which is the scratchpad picker -- move it. Setting the option (rather
# than re-binding below tpm) is order-independent: resurrect reads it on load.
# continuum auto-saves anyway, so the manual key is near-unused.
set -g @resurrect-save 'M-s'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
