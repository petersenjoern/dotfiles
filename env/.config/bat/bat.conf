# config for direnv

# No --theme here on purpose. bat treats config-file flags as command-line
# arguments, so one would beat $BAT_THEME, which .zsh_profile sets to `ansi` on
# Omarchy (follows the theme's terminal palette) and TwoDark elsewhere.

# Show line numbers, Git modifications and file header (but no grid)
--style="numbers,changes,header"

# Use italic text on the terminal (not supported on all terminals)
--italic-text=always

# Use C++ syntax for Arduino .ino files
--map-syntax "*.ino:C++"
