# Overrides on top of Omarchy's ghostty defaults. Loaded last by
# ~/.config/ghostty/config — see the note there about include precedence.

# More breathing room than Omarchy's 14px, plus space under the prompt.
window-padding-balance = true
window-padding-x = 40,40
window-padding-y = 40,100

# Free control+shift+e for TUIs.
keybind = control+shift+e=unbind
