## Atuin configuration
## See: https://docs.atuin.sh/configuration/config/

## Sync: self-hosted on the homelab laptop. The shell rc sets ATUIN_SYNC_ADDRESS from
## REMOTE_TAILNET (dotfiles.local.conf), so the tailnet name stays out of this repo.

## Search
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "host"
style = "compact"

## Privacy
secrets_filter = true  # pragma: allowlist secret
history_filter = [
    "^export .*TOKEN",
    "^export .*SECRET",
    "^export .*PASSWORD",
    "^export .*KEY=",
    "^export .*CREDENTIAL",
    "op read ",
    "op item ",
]
